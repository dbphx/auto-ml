<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Auto ML API · Swagger UI</title>
    <link rel="stylesheet" href="/static/swagger-ui/swagger-ui.css" />
    <style>body{margin:0;background:#f5f7fa}.api-link{position:fixed;right:18px;top:14px;z-index:5;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#245eea;text-decoration:none}.topbar{display:none!important}.swagger-ui .info{margin:28px 0}.swagger-ui .scheme-container{box-shadow:none;background:#fff;border:1px solid #e5e9ef;border-radius:10px}</style>
  </head>
  <body>
    <a class="api-link" href="/openapi.json" target="_blank" rel="noreferrer">OpenAPI JSON ↗</a>
    <div id="swagger-ui"></div>
    <script src="/static/swagger-ui/swagger-ui-bundle.js"></script>
    <script>window.onload=()=>SwaggerUIBundle({url:'/openapi.json',dom_id:'#swagger-ui',deepLinking:true,displayRequestDuration:true,presets:[SwaggerUIBundle.presets.apis],layout:'BaseLayout'});</script>
  </body>
</html>
